name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 不要用默认的 packages（里面的 tools 包已被 Google 下架）
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Restore signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/koebox.jks
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "已恢复签名密钥"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 KEYSTORE_BASE64，本次产物使用调试签名，无法覆盖安装正式版"
          fi

      - name: Build release
        env:
          KOEBOX_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KOEBOX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect artifact
        run: |
          mkdir -p out
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VERSION="dev-${GITHUB_SHA::7}"; fi
          cp app/build/outputs/apk/release/app-release.apk "out/koebox-${VERSION}.apk"
          ls -lh out/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: koebox-apk
          path: out/*.apk
